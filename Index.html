<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VIBRA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;overflow-x:hidden;padding-bottom:70px}
header{position:sticky;top:0;z-index:20;background:#000;padding:10px;display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:22px;color:#ff2d55;letter-spacing:1px}
.logo span{color:#00e5ff}
.search{flex:1;background:#1a1a1a;border-radius:20px;padding:8px 14px;color:#888;font-size:13px}
.tabs{display:flex;gap:8px;padding:8px 10px;position:sticky;top:52px;background:#000;z-index:20}
.tab{flex:1;text-align:center;padding:8px;border-radius:20px;font-size:13px;font-weight:700;background:#222;cursor:pointer}
.tab.active{background:linear-gradient(90deg,#ff2d55,#00e5ff);color:#fff}
.feed{max-width:480px;margin:0 auto}
.video-card{position:relative;background:#111;margin-bottom:12px;border-radius:12px;overflow:hidden}
.video-card video{width:100%;display:block;max-height:75vh;object-fit:cover;background:#000}
.video-card img.cover{width:100%;display:block;max-height:75vh;object-fit:cover}
.side-actions{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:14px;align-items:center;z-index:5}
.side-actions button{background:rgba(0,0,0,.5);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.side-actions span{font-size:11px;margin-top:-10px}
.user-avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #ff2d55;background:#333}
.info{position:absolute;left:10px;bottom:10px;right:70px;z-index:5;text-shadow:0 1px 4px #000}
.info b{font-size:14px}
.info p{font-size:13px;line-height:1.4;margin-top:4px;color:#eee}
.hashtags{color:#00e5ff;font-size:12px}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.row button{background:#222;border:none;color:#fff;padding:6px 10px;border-radius:15px;font-size:11px;cursor:pointer}
.row button.red{background:#ff2d55}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:8px 0 12px;z-index:30}
.bottom-nav div{text-align:center;font-size:11px;cursor:pointer;color:#aaa}
.bottom-nav div.active{color:#fff}
.bottom-nav .plus{background:#fff;color:#000;width:42px;height:26px;border-radius:8px;font-size:20px;line-height:26px;margin:0 auto}
.page{display:none;max-width:480px;margin:0 auto;padding:16px}
.page.active{display:block}
.me-top{text-align:center;padding:20px 0}
.me-avatar-wrap{position:relative;width:110px;height:110px;margin:0 auto}
.me-avatar-wrap img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #ff2d55;background:#333}
.me-avatar-wrap label{position:absolute;bottom:0;right:0;background:#ff2d55;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.me-top h2{margin-top:10px}
.me-top p{color:#aaa;font-size:13px}
.stats{display:flex;justify-content:space-around;background:#111;padding:14px;border-radius:12px;margin:14px 0}
.stats b{display:block;font-size:16px}
.stats span{font-size:12px;color:#aaa}
.btn{width:100%;padding:12px;background:#ff2d55;border:none;color:#fff;border-radius:10px;font-weight:700;margin-top:10px;cursor:pointer}
.btn.blue{background:#00c2ff}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-top:12px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#222}
input[type=file]{display:none}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>

<header>
  <div class="logo">VIBRA</div>
  <div class="search">Search...</div>
  <div>✅</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showTab(this,'foryou')">For You</div>
  <div class="tab" onclick="showTab(this,'following')">Following</div>
  <div class="tab" onclick="showTab(this,'live')">LIVE</div>
</div>

<!-- HOME / FEED -->
<div id="homePage">
  <div class="feed" id="feed"></div>
</div>

<!-- ME PAGE -->
<div id="mePage" class="page">
  <div class="me-top">
    <div class="me-avatar-wrap">
      <img id="meAvatar" class="user-avatar" src="https://i.pravatar.cc/300?img=12" alt="profile">
      <label for="dpInput">📷</label>
      <input type="file" id="dpInput" accept="image/*">
    </div>
    <h2 id="meName">@Mr Vibra</h2>
    <p>Vibra Creator • Tanzania 🇹🇿</p>
    <button class="btn" onclick="document.getElementById('dpInput').click()">Badilisha DP</button>
    <button class="btn blue" onclick="showToast('Profile imesave!')">Save Profile</button>
  </div>
  <div class="stats">
    <div><b>12</b><span>Following</span></div>
    <div><b>1.2K</b><span>Followers</span></div>
    <div><b>45</b><span>Likes</span></div>
  </div>
  <h3>Videos Zangu</h3>
  <div class="grid" id="myGrid"></div>
  <p style="color:#aaa;font-size:12px;margin-top:14px;text-align:center">DP yako ikibadilika hapa, itabadilika pia kwenye Feed automatically.</p>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div class="active" onclick="goHome(this)">🏠<br>Home</div>
  <div onclick="showToast('Discover bado inaandaliwa')">🔍<br>Discover</div>
  <div onclick="showToast('Upload - chagua video')"><div class="plus">+</div></div>
  <div onclick="showToast('VIBRA AI ✨')">✨<br>VIBRA AI</div>
  <div onclick="showToast('Huna message mpya')">💬<br>Inbox</div>
  <div onclick="goMe(this)">👤<br>Me</div>
</div>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_DP = "https://i.pravatar.cc/300?img=12";
const videos = [
  {user:"@Mr Vibra", caption:"Kumwekea dawa ya macho, dawa yote inaingia nje ya macho 😂 Huyo demu ni fundi wa kuchekesha, sio wa dawa!", tags:"#Vibra #VibraKenya #Mombasa #Kenya #FunnyVideo #ViralVideo #ForYou #Comedy", video:"https://www.w3schools.com/html/mov_bbb.mp4", cover:"https://picsum.photos/600/800?random=1", likes:1},
  {user:"@Mr Vibra", caption:"Mombasa vibes 🔥 #Trending #Vibra254", tags:"#Vibra #Mombasa #Trending", video:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4", cover:"https://picsum.photos/600/800?random=2", likes:12},
  {user:"@Mr Vibra", caption:"Usiku wa Mombasa ni moto! 🌙", tags:"#Vibra #Night #Kenya", video:"https://www.w3schools.com/html/movie.mp4", cover:"https://picsum.photos/600/800?random=3", likes:8},
];

function getDP(){ return localStorage.getItem('vibra_dp') || DEFAULT_DP; }

function renderFeed(){
  const dp = getDP();
  const feed = document.getElementById('feed');
  feed.innerHTML = videos.map((v,i)=>`
    <div class="video-card">
      <video src="${v.video}" poster="${v.cover}" controls playsinline loop></video>
      <div class="side-actions">
        <img class="user-avatar feed-avatar" src="${dp}" alt="profile">
        <button onclick="like(this)">❤️</button><span>${v.likes}</span>
        <button>💬</button><span>0</span>
        <button>↗️</button><span>Share</span>
        <button>⬇️</button>
      </div>
      <div class="info">
        <b>${v.user}</b> <span style="background:#ff2d55;padding:3px 8px;border-radius:10px;font-size:11px">Follow</span>
        <p>${v.caption}</p>
        <div class="hashtags">${v.tags}</div>
        <div class="row"><button class="red">Edit Caption</button><button>Delete Video</button><button>Save Offline</button><button>Media Player</button></div>
        <div class="row"><button>Prev</button><button>Next</button></div>
      </div>
    </div>
  `).join('');
  // My grid pia itumie DP
  document.getElementById('myGrid').innerHTML = videos.map(v=>`<img src="${v.cover}">`).join('');
}

function syncDP(){
  const dp = getDP();
  document.getElementById('meAvatar').src = dp;
  document.querySelectorAll('.feed-avatar').forEach(img=> img.src = dp);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=> t.style.display='none',2000);
}
function like(btn){
  let s = btn.nextElementSibling;
  s.textContent = parseInt(s.textContent)+1;
  btn.style.background='#ff2d55';
}
function showTab(el,tab){ document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); showToast(tab==='foryou'?'For You':tab); }
function goHome(el){
  document.getElementById('homePage').style.display='block';
  document.getElementById('mePage').classList.remove('active');
  document.querySelectorAll('.bottom-nav div').forEach(d=>d.classList.remove('active')); el.classList.add('active');
}
function goMe(el){
  document.getElementById('homePage').style.display='none';
  document.getElementById('mePage').classList.add('active');
  document.querySelectorAll('.bottom-nav div').forEach(d=>d.classList.remove('active')); el.classList.add('active');
  syncDP();
}

// HAPA NDIPO DP INA-SAVE - mara moja inakwenda kote
document.getElementById('dpInput').addEventListener('change', function(e){
  if(!e.target.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    localStorage.setItem('vibra_dp', ev.target.result);
    localStorage.setItem('profilePic', ev.target.result);
    renderFeed();
    syncDP();
    showToast('DP imebadilika kote! ✅ Me + Feed');
  };
  reader.readAsDataURL(e.target.files[0]);
});

renderFeed();
syncDP();
</script>
</body>
</html>
