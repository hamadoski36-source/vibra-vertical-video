<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibra</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial}
.top{display:flex;justify-content:space-between;padding:12px;align-items:center}
.logo{font-size:28px;font-weight:bold} .logo span{color:#a855f7}
.stories{display:flex;gap:10px;padding:10px;overflow:auto}
.story{text-align:center;font-size:11px}
.circle{width:55px;height:55px;border-radius:50%;border:3px solid #e1306c;background:#333;display:flex;align-items:center;justify-content:center;font-size:22px}
.live-btn{background:linear-gradient(90deg,#a855f7,#f97316);padding:10px 15px;border-radius:20px;font-weight:bold}
.video{position:relative;height:65vh;background:#111;display:flex;align-items:center;justify-content:center}
.video video{width:100%;height:100%;object-fit:cover}
.side{position:absolute;right:10px;bottom:100px;display:flex;flex-direction:column;gap:12px}
.icon{background:rgba(0,0,0,.5);padding:12px;border-radius:15px;text-align:center}
.ai{position:absolute;right:70px;bottom:100px;background:linear-gradient(90deg,#a855f7,#f97316);width:65px;height:65px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 20px #a855f7}
.bottom{display:flex;justify-content:space-around;padding:12px;background:#111;position:fixed;bottom:0;width:100%}
</style>
</head>
<body>
<div class="top"><div class="logo"><span>V</span> vibra</div><div>🔍 📷</div></div>
<div class="stories">
<div class="story"><div class="circle">😀</div>lexi<br>● LIVE</div>
<div class="story"><div class="circle">😎</div>jude<br>● LIVE</div>
<div class="story"><div class="circle">💖</div>noa<br>● LIVE</div>
<div class="story"><div class="circle">🔥</div>kris<br>● LIVE</div>
<div class="story"><div class="circle">🌟</div>raya<br>● LIVE</div>
<div class="live-btn">GO LIVE ☀️</div>
</div>
<div style="padding:0 10px">Following &nbsp; <b>For You</b> &nbsp; <span style="background:red;padding:3px 8px;border-radius:8px">● LIVE</span></div>
<div class="video">
<video controls autoplay muted loop src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
<div class="side">
<div class="icon">❤️<br>123.4K</div>
<div class="icon">💬<br>1.2K</div>
<div class="icon">↗️<br>892</div>
<div class="icon">🔖<br>342</div>
</div>
<div class="ai">✨</div>
<div style="position:absolute;left:10px;bottom:10px"><b>@maya.dance</b><br>New dance challenge #fyp<br>🎵 Original Sound - vibra.sound</div>
</div>
<div class="bottom"><div>🏠<br>Home</div><div>🔍<br>Search</div><div>➕<br>Post</div><div>💬<br>Inbox</div><div>👤<br>Profile</div></div>
</body>
</html>
