<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBRA</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}.feed{scroll-snap-type:y mandatory;overflow-y:scroll;height:100vh}.vid{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center}video{height:100%;width:100%;object-fit:cover}.info{position:absolute;bottom:20px;left:10px;right:70px;background:rgba(0,0,0,.5);padding:10px;border-radius:10px}.top{position:fixed;top:10px;left:0;right:0;text-align:center;z-index:20;font-size:22px;font-weight:bold;background:rgba(0,0,0,.6);padding:10px}.up{position:fixed;bottom:20px;right:10px;background:#ff0050;color:#fff;padding:14px 18px;border-radius:25px;z-index:20;font-weight:bold;border:0;font-size:16px}#box{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:30;display:none;padding:20px;text-align:center}#box textarea{width:100%;padding:10px;border-radius:10px;margin:10px 0}button{cursor:pointer}</style>
</head><body>
<div class="top">🔥 VIBRA</div>
<button class="up" onclick="document.getElementById('box').style.display='block'">+ POST</button>
<div class="feed" id="feed"><div style="padding:120px;text-align:center">⏳ Inapakia VIBRA...</div></div>

<div id="box">
<h2>🔥 Post Video Mpya</h2>
<input type="file" id="file" accept="video/*" style="background:#222;padding:15px;width:100%;border-radius:12px;color:#fff">
<textarea id="cap" rows="3">Mbosso amemnyooshea mikono juu Konde Bwoy 🔥🔥 Verse yake imeshika balaa! Unaipa ngapi 1-10? 👇 #Mbosso #KondeBwoy #Vibra</textarea>
<button onclick="postVideo()" style="background:#ff0050;color:#fff;border:0;padding:15px;border-radius:12px;width:100%;font-size:18px;font-weight:bold">POST SASA 🟢</button>
<button onclick="document.getElementById('box').style.display='none'" style="background:#333;color:#fff;border:0;padding:12px;border-radius:12px;width:100%;margin-top:10px">Funga ✖️</button>
<div id="msg" style="background:#222;padding:15px;border-radius:10px;margin-top:15px;word-break:break-all">Chagua video kwanza...</div>
</div>

<script>
const URL="https://svrjacetnlwlwesferwz.supabase.co";
const KEY="sb_publishable_iXum9XuFOTo261UcV49ZNQ_LtZBp5kc";
let f=null;
document.getElementById('file').addEventListener('change',e=>{
  f=e.target.files[0];
  document.getElementById('msg').innerText = f ? "✅ Umechagua: "+f.name+" | Sasa bonyeza POST SASA" : "Hakuna file";
});
async function load(){
  let r=await fetch(URL+"/rest/v1/vibra_videos?select=*&order=created_at.desc&limit=20",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
  let data=await r.json();
  let feed=document.getElementById('feed');
  if(!data.length){feed.innerHTML='<div style="padding:120px;text-align:center">Hakuna video bado.<br><br>Bonyeza + POST hapo chini kuweka ya kwanza!</div>';return;}
  feed.innerHTML=data.map(v=>`<div class="vid"><video src="${v.video_url}" controls loop playsinline></video><div class="info"><b>@${v.username||'Mr vibra'}</b><p>${v.caption||''}</p></div></div>`).join('');
}
async function postVideo(){
  let m=document.getElementById('msg');
  if(!f){ m.innerText="❌ CHAGUA VIDEO KWANZA!"; return; }
  m.innerText="⏳ INAPAKIA... USIFUNGE!";
  let name=Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9.-]/g,'');
  try{
    let up=await fetch(URL+"/storage/v1/object/vibra-videos/"+name, {method:"POST", headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":f.type, "x-upsert":"true"}, body:f});
    if(!up.ok){ m.innerText="❌ KOSA STORAGE: "+up.status+" "+await up.text(); return; }
    let video_url=URL+"/storage/v1/object/public/vibra-videos/"+name;
    let ins=await fetch(URL+"/rest/v1/vibra_videos", {method:"POST", headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json", Prefer:"return=minimal"}, body:JSON.stringify({username:"Mr vibra", caption:document.getElementById('cap').value, video_url:video_url})});
    if(!ins.ok){ m.innerText="❌ KOSA TABLE: "+ins.status+" "+await ins.text(); return; }
    m.innerText="✅✅ IMETUMWA!";
    setTimeout(()=>{document.getElementById('box').style.display='none'; load();},1500);
  }catch(e){ m.innerText="❌ KOSA: "+e.message; }
}
load();
</script></body></html>
