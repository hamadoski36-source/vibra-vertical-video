<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBRA</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}.feed{scroll-snap-type:y mandatory;overflow-y:scroll;height:100vh}.vid{height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center}video{height:100%;width:100%;object-fit:cover}.info{position:absolute;bottom:20px;left:10px;right:70px}.top{position:fixed;top:10px;left:0;right:0;text-align:center;z-index:10;font-size:22px;font-weight:bold}.up{position:fixed;bottom:20px;right:10px;background:#ff0050;color:#fff;padding:12px 15px;border-radius:20px;text-decoration:none;z-index:10;font-weight:bold}</style>
</head><body>
<div class="top">🔥 VIBRA</div>
<a class="up" href="upload.html">+ POST</a>
<div class="feed" id="feed"><div style="padding:100px;text-align:center">⏳ Inapakia video...</div></div>
<script>
const URL="https://svrjacetnlwlwesferwz.supabase.co";
const KEY="sb_publishable_iXum9XuFOTo261UcV49ZNQ_LtZBp5kc";
async function load(){
  let r=await fetch(URL+"/rest/v1/vibra_videos?select=*&order=created_at.desc&limit=20",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
  let data=await r.json();
  let feed=document.getElementById('feed');
  if(!data.length){feed.innerHTML='<div style="padding:100px;text-align:center">Hakuna video bado.<br><br><a href="upload.html" style="color:#ff0050">Post ya kwanza -></a></div>';return;}
  feed.innerHTML=data.map(v=>`<div class="vid"><video src="${v.video_url}" controls loop playsinline preload="metadata"></video><div class="info"><b>@${v.username||'Mr vibra'}</b><p>${v.caption||''}</p></div></div>`).join('');
}
load();
</script></body></html>
