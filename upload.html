<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIBRA Upload</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;padding:15px;text-align:center}button{background:#ff0050;color:#fff;border:0;padding:15px;border-radius:12px;width:100%;font-size:18px;font-weight:bold;margin-top:10px}textarea{width:100%;padding:10px;border-radius:10px;margin:10px 0}#msg{background:#222;padding:15px;border-radius:10px;margin-top:15px;word-break:break-all}</style>
</head><body>
<h2>🔥 VIBRA - Post Video Mpya</h2>
<input type="file" id="file" accept="video/*" style="background:#222;padding:15px;width:100%;border-radius:12px">
<textarea id="cap" rows="3">Mbosso amemnyooshea mikono juu Konde Bwoy 🔥🔥 Verse yake imeshika balaa! Unaipa ngapi 1-10? 👇 #Mbosso #KondeBwoy #Vibra</textarea>
<button id="btn">POST SASA 🟢</button>
<div id="msg">Chagua video kwanza...</div>
<p><a href="index.html" style="color:#aaa">← Rudi VIBRA</a></p>
<script>
const URL="https://svrjacetniwljwesferwz.supabase.co";
const KEY="sb_publishable_iXum9XuFOTo261UcV49ZNQ_LtZBp5kc";
let f=null;
document.getElementById('file').addEventListener('change',e=>{
  f=e.target.files[0];
  document.getElementById('msg').innerText = f ? "✅ Umechagua: "+f.name+" | "+(f.size/1024/1024).toFixed(1)+"MB | Sasa bonyeza POST SASA" : "Hakuna file";
});
document.getElementById('btn').addEventListener('click', async ()=>{
  let m=document.getElementById('msg');
  if(!f){ m.innerText="❌ CHAGUA VIDEO KWANZA!"; return; }
  m.innerText="⏳ INAPAKIA... USIFUNGE! 0%";
  let name=Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9.-]/g,'');
  try{
    let up=await fetch(URL+"/storage/v1/object/vibra-videos/"+name, {method:"POST", headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":f.type, "x-upsert":"true"}, body:f});
    if(!up.ok){ m.innerText="❌ KOSA STORAGE: "+up.status+" "+await up.text(); return; }
    let video_url=URL+"/storage/v1/object/public/vibra-videos/"+name;
    m.innerText="⏳ Video imepanda! Inahifadhi kwenye VIBRA...";
    let ins=await fetch(URL+"/rest/v1/vibra_videos", {method:"POST", headers:{apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json", Prefer:"return=minimal"}, body:JSON.stringify({username:"Mr vibra", caption:document.getElementById('cap').value, video_url:video_url})});
    if(!ins.ok){ m.innerText="❌ KOSA TABLE: "+ins.status+" "+await ins.text(); return; }
    m.innerText="✅✅ IMETUMWA! Fungua VIBRA uione!";
    setTimeout(()=>location.href='index.html',2000);
  }catch(e){ m.innerText="❌ KOSA: "+e.message; }
});
</script></body></html>
